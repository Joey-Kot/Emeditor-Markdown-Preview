name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build and test ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
          - arch: x86
            platform: Win32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build embedded preview assets
        run: npm run build:assets
      - name: Test preview in Chromium
        shell: pwsh
        run: |
          $chrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path $chrome)) { throw 'Google Chrome is required for the browser integration test.' }
          $env:MARKDOWN_PREVIEW_CHROME_PATH = $chrome
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.platform }}
      - name: Compile plug-in
        run: cmake --build build --config Release --parallel
      - name: Test native helpers
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload DLL
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: markdown-preview-windows-${{ matrix.arch }}
          path: build/Release/MarkdownPreview.dll
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish release packages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: markdown-preview-windows-*
          path: artifacts
      - name: Package the two DLLs
        run: |
          mkdir -p dist
          (cd artifacts/markdown-preview-windows-x86 && zip -q "$GITHUB_WORKSPACE/dist/Markdown-Preview-x86.zip" MarkdownPreview.dll)
          (cd artifacts/markdown-preview-windows-x64 && zip -q "$GITHUB_WORKSPACE/dist/Markdown-Preview-x64.zip" MarkdownPreview.dll)
          (cd dist && sha256sum Markdown-Preview-x86.zip > Markdown-Preview-x86.zip.sha256)
          (cd dist && sha256sum Markdown-Preview-x64.zip > Markdown-Preview-x64.zip.sha256)
          {
            printf 'SHA-256 checksums for the release archives:\n\n```\n'
            cat dist/Markdown-Preview-x86.zip.sha256 dist/Markdown-Preview-x64.zip.sha256
            printf '```\n'
          } > release-notes.md
      - name: Update Latest tag
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/Latest" --jq '.object.sha'; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/Latest" -f sha="$RELEASE_SHA" -F force=true
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/Latest -f sha="$RELEASE_SHA"
          fi
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref == 'refs/heads/main' && 'Latest' || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json id; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/*.zip.sha256 --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/*.zip.sha256 --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
